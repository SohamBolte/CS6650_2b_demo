global:
  # The default is 15s. A two minute load test would give only eight data
  # points at that rate, which makes the idle to loaded transition look like
  # a step rather than a curve. 5s gives twenty four.
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: product-api
    static_configs:
      # "app" is the compose service name. Docker's internal DNS resolves it,
      # which is why this is not localhost. Inside the Prometheus container,
      # localhost is Prometheus itself.
      - targets: ["app:8080"]
